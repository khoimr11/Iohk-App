<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IOHK Video</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Dancing+Script:wght@700&family=Pacifico&family=DotGothic16&family=Bebas+Neue&display=swap">
<style>
:root{
  --bg:#0a0a0b;--fg:#f4f1ea;--muted:rgba(244,241,234,.64);--faint:rgba(244,241,234,.40);--line:rgba(255,255,255,.09);
  --glass:rgba(22,23,26,.72);--glass-solid:#16171a;--panel:#121315;--well:rgba(255,255,255,.05);--well-hi:rgba(255,255,255,.10);
  --accent:#e9b45c;--sel:#f4f1ea;--danger:#ff7a6b;
  --font-ui:"Inter",system-ui,-apple-system,"SF Pro Text","Segoe UI",sans-serif;
  --font-display:"Cormorant Garamond","Cormorant",Georgia,serif;
  --topbar:56px;color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:13px/1.45 var(--font-ui);letter-spacing:-.006em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overscroll-behavior:none;font-feature-settings:"cv05","cv11"}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(160%);backdrop-filter:blur(30px) saturate(160%);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 18px 50px rgba(0,0,0,.45)}
.ib{width:34px;height:34px;border-radius:9px;display:inline-grid;place-items:center;color:var(--muted);flex:none}
.ib:hover{background:var(--well-hi);color:var(--fg)}
.ib[aria-pressed="true"]{background:var(--fg);color:#121212}
.ib[disabled]{opacity:.3;cursor:default;background:none}
.pbtn{height:34px;border-radius:999px;padding:0 18px;background:var(--fg);color:#121212;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:8px;flex:none}
.pbtn:hover{filter:brightness(.92)}
.pbtn[disabled]{opacity:.55;cursor:progress}
.tbtn{height:30px;border-radius:8px;padding:0 12px;background:var(--well);border:1px solid var(--line);font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.tbtn:hover{background:var(--well-hi)}
.tbtn[aria-pressed="true"],.tbtn.on{background:var(--fg);color:#121212;border-color:var(--fg)}
.tbtn.primary{background:var(--fg);color:#121212;border-color:var(--fg);font-weight:600}
.tbtn.warn{color:var(--danger)}
.sep{width:1px;height:18px;background:var(--line);margin:0 6px;flex:none}
.brand{display:flex;align-items:baseline;gap:10px;flex:none}
.wm-name{font-family:var(--font-display);font-weight:500;font-size:24px;letter-spacing:.14em;display:flex;align-items:center;line-height:1}
.wm-o{width:.72em;height:.72em;margin:0 .14em 0 .02em;display:block}
.wm-sub{font-size:9px;font-weight:600;letter-spacing:.42em;text-transform:uppercase;color:var(--faint)}
.modes{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--well);border:1px solid var(--line);flex:none}
.mode{height:28px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;font-size:12.5px;font-weight:500;color:var(--muted)}
.mode:hover{color:var(--fg)}
.mode[aria-current="page"]{background:var(--fg);color:#121212}
.topbar{height:var(--topbar);display:flex;align-items:center;gap:16px;padding:0 14px 0 20px;box-sizing:border-box;border-bottom:1px solid var(--line);background:#0d0d0f;flex:none}
.topbar .mid{display:flex;align-items:center;gap:2px;margin:0 auto}
.topbar .right{display:flex;align-items:center;gap:8px}
.mbrand{display:none;align-items:center;gap:8px;height:38px;padding:0 10px 0 4px;border-radius:19px;font-size:13px;font-weight:600}
.mbrand img{width:28px;height:28px;border-radius:8px}
.mbrand svg.i{width:14px;height:14px;color:var(--faint)}
.modemenu{position:fixed;z-index:60;top:52px;left:10px;border-radius:16px;padding:6px;display:flex;flex-direction:column;min-width:200px}
.modemenu a{display:flex;flex-direction:column;padding:10px 12px;border-radius:10px;font-weight:600;font-size:14px}
.modemenu a small{font-weight:400;font-size:11.5px;color:var(--faint)}
.modemenu a[aria-current="page"]{background:var(--well-hi)}
@media (max-width:899px){.topbar{padding:0 8px;gap:4px}.topbar .brand,.topbar .modes{display:none}.mbrand{display:flex}.topbar .mid{margin:0 0 0 auto}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:28px;padding:0 11px;border-radius:999px;background:var(--well);border:1px solid var(--line);font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);color:#121212;border-color:var(--fg)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:0 8px}
.row label{font-size:12.5px;color:var(--muted)}
.row .val{font-size:12px;font-variant-numeric:tabular-nums;color:var(--fg);min-width:40px;text-align:right}
.row input[type=range]{grid-column:1/-1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:1px;background:var(--track,rgba(255,255,255,.18))}
input[type=range]::-moz-range-track{height:2px;border-radius:1px;background:var(--track,rgba(255,255,255,.18))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;margin-top:-6px;box-shadow:0 1px 5px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff}
.field{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;color:var(--fg);box-sizing:border-box}
select.field{padding:5px 8px;height:30px}
textarea.field{resize:vertical;min-height:64px;width:100%}
.swatches{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.swatch{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.2)}
.swatch[aria-pressed="true"]{outline:2px solid #fff;outline-offset:2px}
input[type=color]{width:28px;height:28px;border:0;padding:0;background:none;border-radius:50%;cursor:pointer}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h4{margin:0;font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.ptitle{margin:0;font:500 22px/1.15 var(--font-display)}
.note{font-size:12px;color:var(--faint);margin:0;line-height:1.5}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(244,241,234,.96);color:#121212;padding:9px 16px;border-radius:999px;font-weight:500;font-size:12.5px;box-shadow:0 8px 30px rgba(0,0,0,.5);z-index:80;max-width:calc(100% - 32px);text-align:center}
.overlay{position:fixed;inset:0;background:rgba(8,8,9,.88);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px}
.dialog{border-radius:20px;padding:22px 24px;width:min(460px,100%);box-sizing:border-box;display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
.dialog h3{margin:0;font:500 24px var(--font-display)}
.bar{height:4px;border-radius:2px;background:var(--well-hi);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--fg);transition:width .2s}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}

/* Video editor layout. Desktop: media bin | preview | inspector, timeline across the bottom (CapCut desktop).
   Mobile: preview on top, play bar, timeline with a fixed centre playhead, icon toolbar and a bottom sheet (CapCut mobile). */
#app{position:fixed;inset:0;display:grid;grid-template-columns:270px minmax(0,1fr) 340px;grid-template-rows:var(--topbar) minmax(0,1fr) auto 264px;grid-template-areas:"top top top" "media prev insp" "media bar insp" "tl tl tl"}
.topbar{grid-area:top}
#media{grid-area:media;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
#prevWrap{grid-area:prev;position:relative;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px;background:#08080a}
#pv{display:block;max-width:100%;max-height:100%;box-shadow:0 20px 60px rgba(0,0,0,.6);background:#000;touch-action:none}
#pbar{grid-area:bar;display:flex;align-items:center;gap:8px;padding:6px 14px;border-top:1px solid var(--line);background:#0c0c0e}
#pbar .tc{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:120px}
#pbar .tc b{color:var(--fg);font-weight:600}
#play{width:40px;height:40px;border-radius:50%;background:var(--fg);color:#121212;display:grid;place-items:center;margin:0 auto}
#play svg{width:18px;height:18px;fill:currentColor;stroke:none}
#insp{grid-area:insp;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
#tlBox{grid-area:tl;border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#0e0e10}
.phd{padding:14px 16px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.phd span{font-size:11.5px;color:var(--faint)}
.mlist{flex:1;min-height:0;padding:4px 12px 14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start}
.mitem{position:relative;border-radius:8px;overflow:hidden;background:#000;aspect-ratio:16/10;display:block;text-align:left}
.mitem canvas,.mitem img{width:100%;height:100%;object-fit:cover;display:block}
.mitem .lb{position:absolute;left:6px;bottom:5px;right:6px;font-size:10.5px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mitem .du{position:absolute;right:5px;top:5px;font-size:10px;font-weight:600;background:rgba(0,0,0,.6);padding:1px 5px;border-radius:4px}
.mitem .add{position:absolute;right:5px;bottom:5px;width:22px;height:22px;border-radius:50%;background:var(--fg);color:#121212;display:none;place-items:center;font-weight:700}
.mitem:hover .add{display:grid}
.mitem.audio{aspect-ratio:auto;height:46px;background:linear-gradient(90deg,#2b2236,#1b2a2c);display:flex;align-items:center;padding:0 10px;grid-column:1/-1}
.mitem.audio .lb{position:static;text-shadow:none}
.drop{margin:4px 12px 8px;border:1.5px dashed rgba(255,255,255,.18);border-radius:12px;padding:16px;text-align:center;color:var(--muted);font-size:12.5px;display:flex;flex-direction:column;gap:10px;align-items:center}
.itabs{display:flex;gap:2px;padding:10px 12px 6px;overflow-x:auto;scrollbar-width:none;flex:none}
.itabs::-webkit-scrollbar{display:none}
.itab{height:30px;padding:0 11px;border-radius:8px;font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
.itab[aria-selected="true"]{background:var(--well-hi);color:var(--fg)}
.ibody{flex:1;min-height:0;padding:6px 16px 20px;display:flex;flex-direction:column;gap:16px}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ptile{display:flex;flex-direction:column;gap:5px;min-width:0;text-align:left}
.ptile canvas{width:100%;aspect-ratio:1;border-radius:7px;background:var(--well);display:block;outline:1.5px solid transparent;outline-offset:2px}
.ptile[aria-pressed="true"] canvas{outline-color:var(--fg)}
.ptile span{font-size:9.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fxgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fx{height:58px;border-radius:10px;background:var(--well);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500;color:var(--muted)}
.fx b{font-size:18px;font-weight:400;color:var(--fg)}
.fx[aria-pressed="true"]{background:var(--fg);color:#121212;border-color:var(--fg)}
.fx[aria-pressed="true"] b{color:#121212}
/* toolbar above timeline */
.tlbar{display:flex;align-items:center;gap:2px;padding:6px 10px;border-bottom:1px solid var(--line);flex:none;overflow-x:auto;scrollbar-width:none}
.tlbar::-webkit-scrollbar{display:none}
.tlbar .grow{flex:1}
.tlbar .zoom{display:flex;align-items:center;gap:6px;width:150px;color:var(--faint)}
/* timeline */
#tl{position:relative;flex:1;min-height:0;user-select:none;-webkit-user-select:none}
#tlScroll{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent;touch-action:pan-x}
#tlInner{position:relative;height:100%}
#playhead{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--fg);z-index:6;pointer-events:none;box-shadow:0 0 6px rgba(0,0,0,.6)}
#playhead::before{content:"";position:absolute;top:0;left:-5px;width:12px;height:8px;background:var(--fg);clip-path:polygon(0 0,100% 0,50% 100%)}
.ruler{position:absolute;left:0;right:0;top:0;height:22px;color:var(--faint);font-size:10px}
.ruler i{position:absolute;top:0;height:6px;border-left:1px solid rgba(255,255,255,.18)}
.ruler i.maj{height:10px;border-color:rgba(255,255,255,.35)}
.ruler b{position:absolute;top:9px;font-weight:500;transform:translateX(-50%);font-variant-numeric:tabular-nums}
.track{position:absolute;left:0;right:0}
.tk-label{position:sticky;left:0;z-index:4;font-size:10px;color:var(--faint);padding:2px 6px}
.blk{position:absolute;top:0;bottom:0;border-radius:6px;overflow:hidden;cursor:pointer;box-sizing:border-box;touch-action:none}
.blk.v{background:#222}
.blk.v canvas{position:absolute;inset:0;width:100%;height:100%}
.blk .bl{position:absolute;left:6px;top:3px;font-size:10px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.9);white-space:nowrap;pointer-events:none;max-width:calc(100% - 12px);overflow:hidden;text-overflow:ellipsis}
.blk .bd{position:absolute;right:6px;bottom:3px;font-size:9.5px;font-weight:600;background:rgba(0,0,0,.55);padding:0 4px;border-radius:3px;pointer-events:none}
.blk.t{background:linear-gradient(180deg,#6f4cc9,#5a3db0);display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:600;white-space:nowrap}
.blk.s{background:linear-gradient(180deg,#c9884c,#a86d36)}
.blk.a{background:linear-gradient(180deg,#1f6f63,#185a50)}
.blk.a canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.85}
.blk.sel{box-shadow:inset 0 0 0 2px var(--fg);z-index:3}
.blk .h{position:absolute;top:0;bottom:0;width:14px;background:var(--fg);display:none;z-index:2}
.blk .h::after{content:"";position:absolute;top:50%;left:50%;width:2px;height:14px;margin:-7px 0 0 -1px;background:#121212;border-radius:1px}
.blk .h.l{left:0;border-radius:6px 0 0 6px}
.blk .h.r{right:0;border-radius:0 6px 6px 0}
.blk.sel .h{display:block}
.tr{position:absolute;z-index:5;width:22px;height:22px;margin-left:-11px;border-radius:6px;background:#f4f1ea;color:#121212;display:grid;place-items:center;font-size:12px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.tr.off{background:rgba(20,20,22,.85);color:var(--fg);border:1px solid rgba(255,255,255,.3)}
.tlempty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--faint);font-size:12.5px;pointer-events:none;text-align:center}
/* tools row (mobile) */
#mtools{display:none}
.mt{flex:none;width:64px;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:10.5px;font-weight:500;color:var(--muted);border-radius:12px}
.mt svg.i{width:22px;height:22px}
.mt:hover,.mt.on{color:var(--fg);background:var(--well)}
.sheet{position:fixed;z-index:40;left:0;right:0;bottom:0;max-height:58dvh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px);background:rgba(18,19,22,.97)}
.sheet.open{transform:none}
.shead{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 0 18px}
.sbody{overflow:auto;padding:6px 16px 18px;display:flex;flex-direction:column;gap:16px}
.vempty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--fg)}
.vempty b{width:64px;height:64px;border-radius:50%;background:var(--fg);color:#121212;display:grid;place-items:center;font-size:34px;font-weight:300}
.vempty small{font-weight:400;font-size:12px;color:var(--faint)}
.busy{display:flex;flex-direction:column;gap:12px}
@media (max-width:1180px){#app{grid-template-columns:230px minmax(0,1fr) 300px}}
@media (max-width:899px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:calc(50px + env(safe-area-inset-top,0px)) minmax(0,1fr) 46px 178px calc(70px + env(safe-area-inset-bottom,0px));grid-template-areas:"top" "prev" "bar" "tl" "tools"}
  .topbar{padding-top:env(safe-area-inset-top,0px);height:auto;border-bottom:0;background:#0a0a0b}
  #media,#insp{display:none}
  #prevWrap{padding:8px}
  #pbar{padding:0 10px;border-top:0}
  #pbar .tc{min-width:0}
  #pbar .dk{display:none}
  .tlbar{display:none}
  #mtools{grid-area:tools;display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;padding:4px 6px env(safe-area-inset-bottom,0px);border-top:1px solid var(--line);background:#0c0c0e;align-items:flex-start}
  #mtools::-webkit-scrollbar{display:none}
  .toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
}
@media (min-width:900px){.sheet,.mbrand{display:none!important}}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 5v10M7.5 10.5L12 15l4.5-4.5M5 15v3a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-split" viewBox="0 0 24 24"><path d="M12 3v18M8 7l-4 5 4 5M16 7l4 5-4 5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V4.5h4V7M6.5 7l1 13h9l1-13"/></symbol>

  for(const [k,codec] of cands){const cfg={codec,width:W,height:H,bitrate:Math.round(br),framerate:fps,latencyMode:"quality"};if(k==="avc")cfg.avc={format:"avc"};
    try{const r=await VideoEncoder.isConfigSupported(cfg);if(r&&r.supported)return {k,cfg:r.config||cfg};}catch(e){}}throw new Error("no codec");}
async function pickAudioCodec(){if(!("AudioEncoder" in window))return null;for(const [k,codec] of [["aac","mp4a.40.2"],["opus","opus"]]){const cfg={codec,sampleRate:48000,numberOfChannels:2,bitrate:192000};
  try{const r=await AudioEncoder.isConfigSupported(cfg);if(r&&r.supported)return {k,cfg};}catch(e){}}return null;}
function seekEl(v,t){return new Promise(r=>{if(Math.abs(v.currentTime-t)<0.001&&v.readyState>=2){r();return;}let done=false;const fin=()=>{if(done)return;done=true;v.removeEventListener("seeked",fin);
  if(v.requestVideoFrameCallback){let k=false;v.requestVideoFrameCallback(()=>{if(!k){k=true;r();}});setTimeout(()=>{if(!k){k=true;r();}},120);}else r();};v.addEventListener("seeked",fin);setTimeout(fin,3000);v.currentTime=t;});}
async function mixAudio(){const has=P.clips.some(c=>c.kind==="video"&&c.vol>0)||P.audios.length;if(!has)return null;
  const sr=48000,oc=new OfflineAudioContext(2,Math.max(1,Math.ceil(total*sr)),sr);let any=false;
  const env=(g,start,dur,vol,fi,fo)=>{g.gain.setValueAtTime(fi>0?0:vol,start);if(fi>0)g.gain.linearRampToValueAtTime(vol,start+fi);if(fo>0){g.gain.setValueAtTime(vol,Math.max(start+fi,start+dur-fo));g.gain.linearRampToValueAtTime(0,start+dur);}};
  for(let i=0;i<P.clips.length;i++){const c=P.clips[i];if(c.kind!=="video"||c.vol<=0)continue;const m=media.get(c.mid),b=m&&await decodeBuf(m);if(!b)continue;any=true;
    const s=oc.createBufferSource();s.buffer=b;s.playbackRate.value=c.speed;const g=oc.createGain();const nt=P.clips[i+1];env(g,c._start,c._dur,c.vol/100,Math.max(c.fadeIn,c._td),Math.max(c.fadeOut,nt&&nt._td||0));
    s.connect(g);g.connect(oc.destination);s.start(c._start,c.in);s.stop(c._start+c._dur);}
  for(const a of P.audios){const m=media.get(a.mid),b=m&&await decodeBuf(m);if(!b)continue;any=true;const d=Math.min(a.out-a.in,total-a.start);if(d<=0)continue;
    const s=oc.createBufferSource();s.buffer=b;const g=oc.createGain();env(g,a.start,d,a.vol/100,a.fadeIn,Math.min(a.fadeOut,d));s.connect(g);g.connect(oc.destination);s.start(a.start,a.in);s.stop(a.start+d);}
  if(!any)return null;return await oc.startRendering();}
async function exportWebCodecs(W,H,fps,br,prog){
  const vc=await pickVideoCodec(W,H,fps,br);if(!window.Mp4Muxer){prog(0,"Tải bộ đóng gói MP4…");await loadScript(MUXER_URL);}
  prog(0,"Trộn âm thanh…");const ab=await mixAudio();if(expCancel)throw new Error("cancel");const ac=ab?await pickAudioCodec():null;if(ab&&!ac)throw new Error("no audio encoder");
  const target=new Mp4Muxer.ArrayBufferTarget();
  const mux=new Mp4Muxer.Muxer({target,video:{codec:vc.k,width:W,height:H,frameRate:fps},audio:ac?{codec:ac.k,numberOfChannels:2,sampleRate:48000}:undefined,fastStart:"in-memory",firstTimestampBehavior:"offset"});
  let err=null,nOut=0;const ve=new VideoEncoder({output:(ch,meta)=>{nOut++;mux.addVideoChunk(ch,meta);},error:e=>{err=e;}});ve.configure(vc.cfg);
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;const cx=cv.getContext("2d",{alpha:false});
  const N=Math.max(1,Math.round(total*fps));els.forEach(v=>v.pause());aus.forEach(a=>a.pause());
  for(let f=0;f<N;f++){if(expCancel){try{ve.close();}catch(e){}throw new Error("cancel");}if(err)throw err;const t=Math.min(total-1e-3,f/fps);
    const act=activeAt(t),liveSet=new Set();
    for(const c of act){if(c.kind!=="video")continue;const v=elFor(c);liveSet.add(v);if(v.readyState<1)await new Promise(r=>{v.addEventListener("loadeddata",r,{once:true});setTimeout(r,5000);});
      const stt=clamp(c.in+(t-c._start)*c.speed,0,Math.max(0,(v.duration||c.out)-0.03));v.muted=true;
      if(v.paused||Math.abs(v.currentTime-stt)>0.35||v.readyState<2){v.pause();await seekEl(v,stt);v.playbackRate=c.speed;try{await v.play();}catch(e){}}
      const t0=performance.now();while(v.currentTime<stt-0.5/fps&&!v.ended&&performance.now()-t0<2500)await new Promise(r=>setTimeout(r,3));}
    els.forEach(v=>{if(!liveSet.has(v)&&!v.paused)v.pause();});
    drawFrame(cx,W,H,t);const vf=new VideoFrame(cv,{timestamp:Math.round(f*1e6/fps),duration:Math.round(1e6/fps)});ve.encode(vf,{keyFrame:f%(fps*2)===0});vf.close();
    while(ve.encodeQueueSize>6)await new Promise(r=>setTimeout(r,4));
    if(f%3===0){prog(f/N*0.92,"Khung "+(f+1)+" / "+N);pctx.drawImage(cv,0,0,pv.width,pv.height);await new Promise(r=>setTimeout(r,0));}}
  els.forEach(v=>{v.pause();v.muted=false;});
  await ve.flush();ve.close();if(err)throw err;window.__vstats={frames:N,chunks:nOut,codec:vc.cfg.codec};
  if(ac&&ab){prog(0.94,"Mã hoá âm thanh…");let aerr=null;const ae=new AudioEncoder({output:(ch,meta)=>mux.addAudioChunk(ch,meta),error:e=>{aerr=e;}});ae.configure(ac.cfg);
    const L=ab.getChannelData(0),R=ab.numberOfChannels>1?ab.getChannelData(1):L,n=ab.length,CH=1024;
    for(let i=0;i<n;i+=CH){const k=Math.min(CH,n-i),buf=new Float32Array(k*2);buf.set(L.subarray(i,i+k),0);buf.set(R.subarray(i,i+k),k);
      const ad=new AudioData({format:"f32-planar",sampleRate:48000,numberOfFrames:k,numberOfChannels:2,timestamp:Math.round(i*1e6/48000),data:buf});ae.encode(ad);ad.close();if(ae.encodeQueueSize>40)await new Promise(r=>setTimeout(r,2));}
    await ae.flush();ae.close();if(aerr)console.warn(aerr);}
  mux.finalize();prog(1,"Hoàn tất");return new Blob([target.buffer],{type:"video/mp4"});}
async function exportRealtime(W,H,fps,br,prog){if(!("MediaRecorder" in window))throw new Error("no MediaRecorder");
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;const cx=cv.getContext("2d",{alpha:false});ensureAudio();if(AC&&AC.state==="suspended")await AC.resume();
  const stream=cv.captureStream(fps);if(recDest)recDest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
  const types=["video/mp4;codecs=avc1.640028,mp4a.40.2","video/mp4;codecs=avc1,mp4a","video/mp4","video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"];
  const mime=types.find(t=>MediaRecorder.isTypeSupported(t))||"";const rec=new MediaRecorder(stream,{mimeType:mime||undefined,videoBitsPerSecond:Math.round(br),audioBitsPerSecond:192000});
  const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  prog(0,"Đang ghi theo thời gian thực — giữ tab này mở");
  await new Promise((res,rej)=>{let t0=0;T=0;syncMedia(0,true);rec.onstop=res;rec.onerror=e=>rej(e.error||e);rec.start(500);playing=true;
    const step=now=>{if(!t0)t0=now;if(expCancel){rec.stop();playing=false;return;}T=(now-t0)/1000;if(T>=total){T=total;drawFrame(cx,W,H,T);playing=false;els.forEach(v=>v.pause());aus.forEach(a=>a.pause());setTimeout(()=>rec.stop(),150);return;}
      syncMedia(T,true);drawFrame(cx,W,H,T);pctx.drawImage(cv,0,0,pv.width,pv.height);prog(T/total,"Đang ghi "+fmt(T)+" / "+fmt(total));requestAnimationFrame(step);};requestAnimationFrame(step);});
  if(expCancel)throw new Error("cancel");const type=(mime||"video/webm").split(";")[0];return {blob:new Blob(chunks,{type}),ext:type.includes("mp4")?"mp4":"webm"};}

/* ---------- Wiring ---------- */
function wire(){
  $("bImport").onclick=()=>$("file").click();$("vEmpty").onclick=()=>$("file").click();$("file").onchange=e=>{importFiles(e.target.files,true);e.target.value="";};
  $("fileAudio").onchange=e=>{importFiles(e.target.files,true);e.target.value="";};
  $("play").onclick=()=>playing?pause():play();$("bExport").onclick=openExport;
  $("bUndo").onclick=()=>restore(hIdx-1);$("bRedo").onclick=()=>restore(hIdx+1);
  $("tSplit").onclick=splitAt;$("tDel").onclick=delSel;$("tDup").onclick=dupSel;$("tLeft").onclick=()=>moveClip(-1);$("tRight").onclick=()=>moveClip(1);
  $("tText").onclick=()=>addText();$("tSticker").onclick=()=>addText("✨");$("tMusic").onclick=()=>$("fileAudio").click();
  $("tZoom").oninput=e=>{pps=4*Math.pow(100,+e.target.value/100);renderTL();};
  $("bFull").onclick=()=>{const w=$("prevWrap");if(document.fullscreenElement)document.exitFullscreen();else if(w.requestFullscreen)w.requestFullscreen().catch(()=>{});};
  document.addEventListener("fullscreenchange",()=>setTimeout(fitPreview,60));
  $("sClose").onclick=closeSheet;
  $("mMode").onclick=e=>{e.stopPropagation();$("modeMenu").hidden=!$("modeMenu").hidden;};document.addEventListener("click",e=>{if(!e.target.closest("#modeMenu,#mMode"))$("modeMenu").hidden=true;});
  const dz=document.body;dz.addEventListener("dragover",e=>{e.preventDefault();});dz.addEventListener("drop",e=>{e.preventDefault();if(e.dataTransfer.files.length)importFiles(e.dataTransfer.files,true);});
  document.addEventListener("keydown",e=>{const tg=e.target;if(tg&&(tg.tagName==="TEXTAREA"||tg.tagName==="INPUT"&&tg.type!=="range"))return;
    const k=e.key.toLowerCase();
    if((e.ctrlKey||e.metaKey)&&k==="z"){e.preventDefault();e.shiftKey?restore(hIdx+1):restore(hIdx-1);return;}
    if((e.ctrlKey||e.metaKey)&&k==="d"){e.preventDefault();dupSel();return;}
    if((e.ctrlKey||e.metaKey)&&k==="e"){e.preventDefault();openExport();return;}
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    if(e.key===" "){e.preventDefault();playing?pause():play();}else if(k==="s")splitAt();else if(e.key==="Delete"||e.key==="Backspace"){if(sel){e.preventDefault();delSel();}}
    else if(e.key==="ArrowLeft"){e.preventDefault();seek(T-(e.shiftKey?1:1/30));scrollToT();}else if(e.key==="ArrowRight"){e.preventDefault();seek(T+(e.shiftKey?1:1/30));scrollToT();}
    else if(e.key==="Home"){seek(0);scrollToT();}else if(e.key==="End"){seek(total);scrollToT();}else if(e.key==="Escape"){if(!$("expBox").hidden&&!expBusy)$("expBox").hidden=true;else{sel=null;closeSheet();renderTL();showInspector();}}});
  let rz=null;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{fitPreview();renderTL();showInspector();},120);});
}
try{initGL();wire();setPps(60);commit();fitPreview();renderMedia();showInspector();setPlayIcon();
  window.__VDEBUG={P:()=>P,media:()=>media,T:()=>T,total:()=>total,seek:t=>{seek(t);scrollToT();},sel:(type,id)=>{sel={type,id};renderTL();showInspector();},exportWC:(r,f)=>exportWebCodecs(...outDims(r||720),f||30,4e6,()=>{}),exportRT:(r,f)=>exportRealtime(...outDims(r||720),f||30,4e6,()=>{}),drawAt:t=>{T=t;syncMedia(t,false);return drawFrame(pctx,pv.width,pv.height,t);}};
}catch(err){document.body.innerHTML='<div style="padding:40px;color:#ddd;font:15px system-ui">Trình duyệt này chưa bật WebGL nên trình dựng video không chạy được. Hãy thử Chrome, Safari hoặc Edge bản mới.</div>';console.error(err);}
