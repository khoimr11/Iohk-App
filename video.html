<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IOHK Video</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IOHK">
<meta name="theme-color" content="#0a0a0b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Dancing+Script:wght@700&family=Pacifico&family=DotGothic16&family=Bebas+Neue&family=Playfair+Display:ital,wght@0,700;1,600&family=Montserrat:wght@800;900&display=swap">
<style>
:root{
  --bg:#0a0a0b;--fg:#f4f1ea;--muted:rgba(244,241,234,.64);--faint:rgba(244,241,234,.40);--line:rgba(255,255,255,.09);
  --glass:rgba(22,23,26,.72);--glass-solid:#16171a;--panel:#121315;--well:rgba(255,255,255,.05);--well-hi:rgba(255,255,255,.10);
  --accent:#e9b45c;--sel:#f4f1ea;--danger:#ff7a6b;
  --font-ui:"Inter",system-ui,-apple-system,"SF Pro Text","Segoe UI",sans-serif;
  --font-display:"Cormorant Garamond","Cormorant",Georgia,serif;
  --topbar:56px;color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:13px/1.45 var(--font-ui);letter-spacing:-.006em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overscroll-behavior:none;font-feature-settings:"cv05","cv11"}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(160%);backdrop-filter:blur(30px) saturate(160%);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 18px 50px rgba(0,0,0,.45)}
.ib{width:34px;height:34px;border-radius:9px;display:inline-grid;place-items:center;color:var(--muted);flex:none}
.ib:hover{background:var(--well-hi);color:var(--fg)}
.ib[aria-pressed="true"]{background:var(--fg);color:#121212}
.ib[disabled]{opacity:.3;cursor:default;background:none}
.pbtn{height:34px;border-radius:999px;padding:0 18px;background:var(--fg);color:#121212;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:8px;flex:none}
.pbtn:hover{filter:brightness(.92)}
.pbtn[disabled]{opacity:.55;cursor:progress}
.tbtn{height:30px;border-radius:8px;padding:0 12px;background:var(--well);border:1px solid var(--line);font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.tbtn:hover{background:var(--well-hi)}
.tbtn[aria-pressed="true"],.tbtn.on{background:var(--fg);color:#121212;border-color:var(--fg)}
.tbtn.primary{background:var(--fg);color:#121212;border-color:var(--fg);font-weight:600}
.tbtn.warn{color:var(--danger)}
.sep{width:1px;height:18px;background:var(--line);margin:0 6px;flex:none}
.brand{display:flex;align-items:baseline;gap:10px;flex:none}
.wm-name{font-family:var(--font-display);font-weight:500;font-size:24px;letter-spacing:.14em;display:flex;align-items:center;line-height:1}
.wm-o{width:.72em;height:.72em;margin:0 .14em 0 .02em;display:block}
.wm-sub{font-size:9px;font-weight:600;letter-spacing:.42em;text-transform:uppercase;color:var(--faint)}
.modes{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--well);border:1px solid var(--line);flex:none}
.mode{height:28px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;font-size:12.5px;font-weight:500;color:var(--muted)}
.mode:hover{color:var(--fg)}
.mode[aria-current="page"]{background:var(--fg);color:#121212}
.topbar{height:var(--topbar);display:flex;align-items:center;gap:16px;padding:0 14px 0 20px;box-sizing:border-box;border-bottom:1px solid var(--line);background:#0d0d0f;flex:none}
.topbar .mid{display:flex;align-items:center;gap:2px;margin:0 auto}
.topbar .right{display:flex;align-items:center;gap:8px}
.mbrand{display:none;align-items:center;gap:8px;height:38px;padding:0 10px 0 4px;border-radius:19px;font-size:13px;font-weight:600}
.mbrand img{width:28px;height:28px;border-radius:8px}
.mbrand svg.i{width:14px;height:14px;color:var(--faint)}
.modemenu{position:fixed;z-index:60;top:52px;left:10px;border-radius:16px;padding:6px;display:flex;flex-direction:column;min-width:200px}
.modemenu a{display:flex;flex-direction:column;padding:10px 12px;border-radius:10px;font-weight:600;font-size:14px}
.modemenu a small{font-weight:400;font-size:11.5px;color:var(--faint)}
.modemenu a[aria-current="page"]{background:var(--well-hi)}
@media (max-width:899px){.topbar{padding:0 8px;gap:4px}.topbar .brand,.topbar .modes{display:none}.mbrand{display:flex}.topbar .mid{margin:0 0 0 auto}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:28px;padding:0 11px;border-radius:999px;background:var(--well);border:1px solid var(--line);font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);color:#121212;border-color:var(--fg)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:0 8px}
.row label{font-size:12.5px;color:var(--muted)}
.row .val{font-size:12px;font-variant-numeric:tabular-nums;color:var(--fg);min-width:40px;text-align:right}
.row input[type=range]{grid-column:1/-1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:1px;background:var(--track,rgba(255,255,255,.18))}
input[type=range]::-moz-range-track{height:2px;border-radius:1px;background:var(--track,rgba(255,255,255,.18))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;margin-top:-6px;box-shadow:0 1px 5px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff}
.field{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;color:var(--fg);box-sizing:border-box}
select.field{padding:5px 8px;height:30px}
textarea.field{resize:vertical;min-height:64px;width:100%}
.swatches{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.swatch{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.2)}
.swatch[aria-pressed="true"]{outline:2px solid #fff;outline-offset:2px}
input[type=color]{width:28px;height:28px;border:0;padding:0;background:none;border-radius:50%;cursor:pointer}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h4{margin:0;font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.ptitle{margin:0;font:500 22px/1.15 var(--font-display)}
.note{font-size:12px;color:var(--faint);margin:0;line-height:1.5}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(244,241,234,.96);color:#121212;padding:9px 16px;border-radius:999px;font-weight:500;font-size:12.5px;box-shadow:0 8px 30px rgba(0,0,0,.5);z-index:80;max-width:calc(100% - 32px);text-align:center}
.overlay{position:fixed;inset:0;background:rgba(8,8,9,.88);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px}
.dialog{border-radius:20px;padding:22px 24px;width:min(460px,100%);box-sizing:border-box;display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
.dialog h3{margin:0;font:500 24px var(--font-display)}
.bar{height:4px;border-radius:2px;background:var(--well-hi);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--fg);transition:width .2s}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}

/* IOHK Video Pro — layout modelled on CapCut desktop: asset rail + library left, player centre, inspector right, multi-track timeline below.
   Phones get CapCut-mobile ergonomics: player, transport, centre-playhead timeline, contextual tool row, bottom sheets. */
:root{--tlh:300px;--rail:64px;--lib:300px;--insp:330px;--sel:#e9b45c;--clip:#2a2b30}
#app{position:fixed;inset:0;display:grid;grid-template-columns:var(--rail) var(--lib) minmax(0,1fr) var(--insp);grid-template-rows:var(--topbar) minmax(0,1fr) 6px var(--tlh);grid-template-areas:"top top top top" "rail lib prev insp" "rz rz rz rz" "tl tl tl tl"}
.topbar{grid-area:top}
.pname{display:flex;align-items:center;gap:8px;min-width:0}
.pname input{background:none;border:1px solid transparent;border-radius:7px;color:var(--fg);font-weight:600;font-size:13px;padding:5px 8px;width:220px;max-width:30vw}
.pname input:hover,.pname input:focus{border-color:var(--line);background:var(--well);outline:0}
.pname small{font-size:11px;color:var(--faint);white-space:nowrap}
#rail{grid-area:rail;display:flex;flex-direction:column;gap:2px;padding:8px 6px;border-right:1px solid var(--line);background:#0e0e10;overflow-y:auto;scrollbar-width:none}
#rail::-webkit-scrollbar{display:none}
.rb{height:54px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;font-weight:500;color:var(--faint);flex:none}
.rb svg.i{width:20px;height:20px}
.rb:hover{color:var(--fg);background:var(--well)}
.rb[aria-selected="true"]{color:var(--fg);background:var(--well-hi)}
#lib{grid-area:lib;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--panel)}
.lhd{padding:14px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.lbody{flex:1;min-height:0;padding:4px 14px 18px;display:flex;flex-direction:column;gap:14px}
#prevArea{grid-area:prev;display:flex;flex-direction:column;min-height:0;background:#08080a}
.phead{height:40px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);flex:none}
.phead .grow{flex:1}
.phead select{height:28px;padding:0 6px;font-size:12px}
#prevWrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
#pv{display:block;box-shadow:0 20px 60px rgba(0,0,0,.6);background:#000;touch-action:none}
#pbar{height:46px;display:flex;align-items:center;gap:6px;padding:0 12px;border-top:1px solid var(--line);flex:none}
#pbar .tc{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:150px}
#pbar .tc b{color:var(--fg);font-weight:600}
#pbar .mid{display:flex;align-items:center;gap:4px;margin:0 auto}
#play{width:38px;height:38px;border-radius:50%;background:var(--fg);color:#121212;display:grid;place-items:center}
#play svg{width:16px;height:16px;fill:currentColor;stroke:none}
#pbar .r{display:flex;align-items:center;gap:4px;min-width:150px;justify-content:flex-end}
#fps{font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
#insp{grid-area:insp;display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--panel)}
.itabs{display:flex;gap:2px;padding:10px 10px 6px;overflow-x:auto;scrollbar-width:none;flex:none;border-bottom:1px solid var(--line)}
.itabs::-webkit-scrollbar{display:none}
.itab{height:30px;padding:0 10px;border-radius:8px;font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap;flex:none}
.itab[aria-selected="true"]{background:var(--well-hi);color:var(--fg)}
.ibody{flex:1;min-height:0;padding:12px 16px 24px;display:flex;flex-direction:column;gap:16px}
#rz{grid-area:rz;cursor:row-resize;background:#0b0b0d;border-top:1px solid var(--line);position:relative}
#rz::after{content:"";position:absolute;left:50%;top:2px;width:36px;height:2px;margin-left:-18px;border-radius:1px;background:rgba(255,255,255,.2)}
#tlBox{grid-area:tl;display:flex;flex-direction:column;min-height:0;background:#0e0e10}
.tlbar{display:flex;align-items:center;gap:2px;padding:5px 10px;border-bottom:1px solid var(--line);flex:none;overflow-x:auto;scrollbar-width:none}
.tlbar::-webkit-scrollbar{display:none}
.tlbar .grow{flex:1}
.tlbar .zoom{display:flex;align-items:center;gap:6px;width:150px;color:var(--faint)}
.tlbar .ib[aria-pressed="true"]{background:rgba(233,180,92,.18);color:var(--sel)}
#tl{position:relative;flex:1;min-height:0;display:flex}
#heads{width:92px;flex:none;border-right:1px solid var(--line);position:relative;overflow:hidden;background:#0e0e10}
#headsIn{position:absolute;left:0;right:0;top:0}
.hd{position:absolute;left:0;right:0;display:flex;align-items:center;gap:2px;padding:0 6px;border-bottom:1px solid rgba(255,255,255,.04);font-size:10px;color:var(--faint)}
.hd svg.i{width:14px;height:14px}
.hd .ib{width:24px;height:24px;border-radius:6px}
.hd .ib.off{color:var(--danger)}
#tlView{position:relative;flex:1;min-width:0;overflow:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent;touch-action:pan-x pan-y}
#tlInner{position:relative}
#playhead{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--fg);z-index:20;pointer-events:none;box-shadow:0 0 6px rgba(0,0,0,.6)}
#playhead::before{content:"";position:absolute;top:0;left:-6px;width:14px;height:10px;background:var(--fg);clip-path:polygon(0 0,100% 0,50% 100%)}
#snapLine{position:absolute;top:0;bottom:0;width:1px;background:var(--sel);z-index:19;pointer-events:none;display:none}
.ruler{position:sticky;top:0;height:24px;z-index:12;background:#0e0e10;color:var(--faint);font-size:10px;border-bottom:1px solid var(--line);cursor:pointer}
.ruler i{position:absolute;bottom:0;height:5px;border-left:1px solid rgba(255,255,255,.16)}
.ruler i.maj{height:9px;border-color:rgba(255,255,255,.35)}
.ruler b{position:absolute;top:3px;font-weight:500;transform:translateX(-50%);font-variant-numeric:tabular-nums;pointer-events:none}
.trk{position:absolute;left:0;right:0;border-bottom:1px solid rgba(255,255,255,.04)}
.trk.main{background:rgba(255,255,255,.025)}
.trk.hot{background:rgba(233,180,92,.08)}
.blk{position:absolute;top:3px;bottom:3px;border-radius:7px;overflow:hidden;cursor:grab;box-sizing:border-box;touch-action:none;contain:strict}
.blk:active{cursor:grabbing}
.blk.v,.blk.o{background:var(--clip)}
.blk canvas.st{position:absolute;inset:0;width:100%;height:100%}
.blk .bl{position:absolute;left:7px;top:4px;font-size:10px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.95);white-space:nowrap;pointer-events:none;max-width:calc(100% - 14px);overflow:hidden;text-overflow:ellipsis;display:flex;gap:5px;align-items:center}
.blk .bl em{font-style:normal;background:rgba(0,0,0,.55);padding:0 5px;border-radius:3px}
.blk .bd{position:absolute;right:6px;bottom:4px;font-size:9.5px;font-weight:600;background:rgba(0,0,0,.55);padding:0 4px;border-radius:3px;pointer-events:none;font-variant-numeric:tabular-nums}
.blk.t{background:linear-gradient(180deg,#7454d6,#5c40b6);display:flex;align-items:center;padding:0 9px;font-size:11px;font-weight:600;white-space:nowrap}
.blk.s{background:linear-gradient(180deg,#d3914f,#b07338)}
.blk.f{background:linear-gradient(180deg,#3d6fd1,#2f58aa);display:flex;align-items:center;padding:0 9px;font-size:11px;font-weight:600;white-space:nowrap}
.blk.a{background:linear-gradient(180deg,#1f7a6c,#185f54)}
.blk.e{background:repeating-linear-gradient(45deg,#24252a 0 8px,#2b2c32 8px 16px);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.blk.a canvas.st{opacity:.9}
.blk.sel{box-shadow:inset 0 0 0 2px var(--sel);z-index:3}
.blk .h{position:absolute;top:0;bottom:0;width:12px;background:var(--sel);display:none;z-index:2;cursor:ew-resize}
.blk .h::after{content:"";position:absolute;top:50%;left:50%;width:2px;height:12px;margin:-6px 0 0 -1px;background:#1d1406;border-radius:1px}
.blk .h.l{left:0}.blk .h.r{right:0}
.blk.sel .h{display:block}
.blk .kf{position:absolute;bottom:3px;width:8px;height:8px;margin-left:-4px;background:var(--sel);transform:rotate(45deg);pointer-events:none;z-index:2;box-shadow:0 0 0 1px #000}
.blk .fl{position:absolute;top:0;bottom:0;background:rgba(0,0,0,.35);pointer-events:none}
.tr{position:absolute;z-index:6;width:20px;height:20px;margin-left:-10px;border-radius:6px;background:var(--fg);color:#121212;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.6)}
.tr svg.i{width:12px;height:12px}
.tr.off{background:rgba(20,20,22,.9);color:var(--fg);border:1px solid rgba(255,255,255,.3)}
.tlempty{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);color:var(--faint);font-size:12.5px;pointer-events:none;text-align:center;z-index:2}
/* library cards */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mitem{position:relative;border-radius:8px;overflow:hidden;background:#000;aspect-ratio:16/10;display:block;text-align:left;cursor:grab}
.mitem canvas{width:100%;height:100%;object-fit:cover;display:block}
.mitem .lb{position:absolute;left:6px;bottom:5px;right:6px;font-size:10.5px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mitem .du{position:absolute;right:5px;top:5px;font-size:10px;font-weight:600;background:rgba(0,0,0,.6);padding:1px 5px;border-radius:4px}
.mitem .add{position:absolute;right:5px;bottom:5px;width:22px;height:22px;border-radius:50%;background:var(--fg);color:#121212;display:none;place-items:center}
.mitem .add svg{width:14px;height:14px}
.mitem:hover .add{display:grid}
.mitem.audio{aspect-ratio:auto;height:46px;background:linear-gradient(90deg,#26303a,#1b2a2c);display:flex;align-items:center;padding:0 10px;grid-column:1/-1}
.mitem.audio .lb{position:static;text-shadow:none}
.drop{border:1.5px dashed rgba(255,255,255,.16);border-radius:12px;padding:16px;text-align:center;color:var(--muted);font-size:12.5px;display:flex;flex-direction:column;gap:10px;align-items:center}
.ptile{display:flex;flex-direction:column;gap:5px;min-width:0;text-align:left}
.ptile canvas{width:100%;aspect-ratio:1;border-radius:7px;background:var(--well);display:block;outline:1.5px solid transparent;outline-offset:2px}
.ptile[aria-pressed="true"] canvas{outline-color:var(--sel)}
.ptile span{font-size:9.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{border-radius:10px;background:var(--well);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:11px;font-weight:500;color:var(--muted);padding:8px 4px;min-height:74px;position:relative;overflow:hidden;text-align:center}
.card:hover{background:var(--well-hi);color:var(--fg)}
.card[aria-pressed="true"]{border-color:var(--sel);color:var(--fg);box-shadow:inset 0 0 0 1px var(--sel)}
.card svg.i{width:22px;height:22px;color:var(--fg)}
/* transition preview tiles */
.tz{width:56px;height:34px;border-radius:5px;position:relative;overflow:hidden;background:#3a3c44}
.tz i,.tz b{position:absolute;inset:0}
.tz i{background:linear-gradient(135deg,#c98b55,#7a4a2a)}
.tz b{background:linear-gradient(135deg,#5b8fbf,#2c4d6f)}
.card:hover .tz b,.card[aria-pressed="true"] .tz b{animation:var(--an) 1.6s ease-in-out infinite alternate}
@keyframes t-fade{from{opacity:0}to{opacity:1}}
@keyframes t-slideL{from{transform:translateX(100%)}to{transform:none}}
@keyframes t-slideU{from{transform:translateY(100%)}to{transform:none}}
@keyframes t-zoom{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
@keyframes t-spin{from{transform:rotate(-90deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes t-wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes t-circle{from{clip-path:circle(0% at 50% 50%)}to{clip-path:circle(75% at 50% 50%)}}
@keyframes t-black{0%{opacity:0;filter:brightness(0)}100%{opacity:1;filter:none}}
@keyframes t-blur{from{filter:blur(6px);opacity:0}to{filter:none;opacity:1}}
/* layout template tiles */
.lt{width:52px;height:40px;position:relative;border-radius:4px;background:#111}
.lt i{position:absolute;background:#6c7a8f;border-radius:2px}
.card[aria-pressed="true"] .lt i,.card:hover .lt i{background:var(--sel)}
/* text template tiles */
.tt{height:56px;width:100%;display:grid;place-items:center;border-radius:8px;background:linear-gradient(135deg,#2b2f3a,#1a1c22);overflow:hidden;font-size:16px;color:#fff;line-height:1}
/* inspector controls */
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:0 6px}
.prow label{font-size:12.5px;color:var(--muted)}
.prow .val{font-size:12px;font-variant-numeric:tabular-nums;color:var(--fg);min-width:44px;text-align:right;background:none;border:0;padding:0}
.prow input[type=range]{grid-column:1/-1}
.kfb{width:22px;height:22px;display:grid;place-items:center;border-radius:6px;color:var(--faint)}
.kfb svg{width:12px;height:12px}
.kfb:hover{background:var(--well-hi);color:var(--fg)}
.kfb.on{color:var(--sel)}
.kfb.on svg{fill:currentColor}
.seg{display:flex;padding:3px;border-radius:9px;background:rgba(0,0,0,.3)}
.seg button{flex:1;height:28px;border-radius:7px;font-size:12px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.12);color:var(--fg)}
.hint{font-size:12px;color:var(--faint);line-height:1.5;margin:0}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.swatch.empty{background:conic-gradient(#f33,#ff3,#3f3,#3ff,#33f,#f3f,#f33)}
.welcome{position:fixed;inset:0;z-index:65;background:rgba(8,8,9,.92);display:flex;align-items:center;justify-content:center;padding:24px}
.wcard{width:min(860px,100%);max-height:100%;overflow:auto;border-radius:22px;padding:28px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px}
.wcard h1{margin:0;font:500 38px/1.05 var(--font-display)}
.wcard>p{margin:0;color:var(--muted)}
.wnew{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.wnew button{height:104px;border-radius:14px;background:var(--well);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:12px;font-weight:600}
.wnew button:hover{background:var(--well-hi)}
.wnew i{display:block;border:1.5px solid var(--fg);border-radius:4px}
.wnew small{font-weight:400;color:var(--faint);font-size:10.5px}
.plist{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.pitem{display:flex;flex-direction:column;gap:6px;text-align:left;position:relative}
.pitem .th{aspect-ratio:16/10;border-radius:10px;background:#1a1b1f center/cover no-repeat;border:1px solid var(--line)}
.pitem b{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem small{font-size:11px;color:var(--faint)}
.pitem .x{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);display:none;place-items:center}
.pitem:hover .x{display:grid}
.pitem .x svg{width:12px;height:12px}
#mtools{display:none}
.mt{flex:none;min-width:62px;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:10px;font-weight:500;color:var(--muted);border-radius:12px;padding:0 2px}
.mt svg.i{width:21px;height:21px}
.mt:hover,.mt.on{color:var(--fg);background:var(--well)}
.sheet{position:fixed;z-index:50;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));max-height:56dvh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;transform:translateY(calc(100% + 80px));transition:transform .28s cubic-bezier(.2,.8,.2,1);background:rgba(18,19,22,.98);box-shadow:0 -12px 40px rgba(0,0,0,.5)}
.sheet.open{transform:none}
.shead{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 0 18px;flex:none}
.stabs{display:flex;gap:2px;padding:6px 10px 2px;overflow-x:auto;scrollbar-width:none;flex:none}
.stabs::-webkit-scrollbar{display:none}
.sbody{overflow:auto;padding:8px 16px 20px;display:flex;flex-direction:column;gap:16px}
.recdot{width:10px;height:10px;border-radius:50%;background:#ff4d4d;display:inline-block;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
@media (max-width:1280px){:root{--lib:260px;--insp:300px}}
@media (max-width:1080px){:root{--lib:230px;--insp:280px}}
@media (max-width:899px){
  :root{--tlh:196px}
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:calc(50px + env(safe-area-inset-top,0px)) minmax(0,1fr) var(--tlh) calc(66px + env(safe-area-inset-bottom,0px));grid-template-areas:"top" "prev" "tl" "tools"}
  .topbar{padding-top:env(safe-area-inset-top,0px);height:auto;background:#0a0a0b}
  .pname,#rail,#lib,#insp,#rz,#heads,.phead,.tlbar,#pbar .r{display:none!important}
  #pbar{height:44px;border-top:0}#pbar .tc{min-width:0}
  #mtools{grid-area:tools;display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;padding:3px 6px env(safe-area-inset-bottom,0px);border-top:1px solid var(--line);background:#0c0c0e;align-items:flex-start}
  #mtools::-webkit-scrollbar{display:none}
  .toast{bottom:calc(180px + env(safe-area-inset-bottom,0px))}
  .wnew{grid-template-columns:repeat(2,minmax(0,1fr))}.plist{grid-template-columns:repeat(2,minmax(0,1fr))}.wcard{padding:20px}
}
@media (min-width:900px){.sheet,.mbrand{display:none!important}}
</style>
